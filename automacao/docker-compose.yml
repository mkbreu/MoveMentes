# (execution_entity) no banco n8n_db; N8N_WEBHOOK_URL vazio; n8n-data/
# intocado desde 28/07. Ele ocupava 276 MB de RAM numa maquina que estava
# com 68 MB livres e o swap esgotado, mais 2,26 GB de imagem em disco.
