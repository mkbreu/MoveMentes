[uwsgi]
module = wsgi:application
virtualenv = /volume1/web/movimente-se/venv
chdir = /volume1/web/movimente-se
pythonpath = /volume1/web/movimente-se
master = true
processes = 2
threads = 2
vacuum = true

# Socket Unix (comunicação com nginx)
socket = /run/movimente-se/movimente-se.sock
chmod-socket = 666

# Logs
logto = /volume1/web/movimente-se/logs/uwsgi.log
log-maxsize = 10485760
log-backupcount = 5

# Performance
enable-threads = true
die-on-term = true

touch-reload = /volume1/web/movimente-se/wsgi.py
