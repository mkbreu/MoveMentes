<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redefinir Senha — MoveMentes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-light">
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow">
        <div class="card-header" style="background-color: #C9FF6E; color: #1a1a1a;">
          <h5 class="mb-0"><i class="fas fa-lock me-2"></i>Redefinir Senha</h5>
        </div>
        <div class="card-body">
          {% with messages = get_flashed_messages(with_categories=true) %}
            {% for cat, msg in messages %}
              <div class="alert alert-{{ 'danger' if cat == 'error' else cat }}">{{ msg }}</div>
            {% endfor %}
          {% endwith %}

          {% if user %}
          <p class="text-muted mb-3">
            Definindo nova senha para: <strong>{{ user.nome }}</strong>
          </p>
          {% endif %}

          <form method="POST">
            <div class="mb-3">
              <label class="form-label fw-bold">Nova senha</label>
              <input type="password" name="nova_senha" class="form-control" required minlength="6" autofocus>
              <div class="form-text">M&iacute;nimo 6 caracteres.</div>
            </div>
            <div class="mb-3">
              <label class="form-label fw-bold">Confirmar nova senha</label>
              <input type="password" name="confirma_senha" class="form-control" required minlength="6">
            </div>
            <button type="submit" class="btn btn-success w-100">
              <i class="fas fa-save me-1"></i>Salvar nova senha
            </button>
          </form>
        </div>
      </div>
      <div class="text-center mt-3">
        <a href="/auth/login" class="text-muted small">Voltar ao login</a>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
