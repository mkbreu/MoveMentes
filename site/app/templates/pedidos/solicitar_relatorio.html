{% extends "base.html" %}
{% block title %}Solicitar relatório — {{ cidade }} — MoveMentes{% endblock %}

{% block content %}
<div class="container py-4" style="max-width: 480px;">
  <h1 class="h4 mb-1"><i class="fas fa-file-invoice-dollar text-success"></i> Solicitar relatório completo</h1>
  <p class="text-muted mb-3">{{ cidade }} — últimos 12 meses, com recibos e pagamentos.</p>
  <form method="post" class="card shadow-sm"><div class="card-body">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div style="position:absolute; left:-9999px;" aria-hidden="true">
      <label>Não preencha <input name="site" tabindex="-1" autocomplete="off"></label>
    </div>
    <div class="mb-3">
      <label class="form-label" for="nome">Nome</label>
      <input class="form-control" id="nome" name="nome" required maxlength="100" value="{{ form.nome or '' }}">
    </div>
    <div class="mb-3">
      <label class="form-label" for="email">E-mail</label>
      <input class="form-control" id="email" name="email" type="email" required value="{{ form.email or '' }}">
    </div>
    <div class="mb-3">
      <label class="form-label" for="telefone">Telefone <span class="text-muted">(opcional)</span></label>
      <input class="form-control" id="telefone" name="telefone" inputmode="tel" value="{{ form.telefone or '' }}">
    </div>
    <button class="btn btn-success w-100">Solicitar relatório</button>
  </div></form>
</div>
{% endblock %}
