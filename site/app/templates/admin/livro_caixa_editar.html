{% extends "base.html" %}
{% block title %}Corrigir lançamento — MoveMentes{% endblock %}
{% from "admin/_caixa_macros.html" import atalhos %}

{% block content %}
<div class="container py-2" style="max-width: 900px;">
  <h1 class="h4 mb-2"><i class="fas fa-pen text-success"></i> Corrigir lançamento — {{ cidade }}</h1>
  {{ atalhos('livro', ano, mes) }}

  <div class="card shadow-sm">
    <div class="card-body">
      <form method="post" action="{{ url_for('caixa.editar', lid=linha.id) }}" enctype="multipart/form-data" class="row g-2">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="col-6 col-md-3">
          <label class="form-label small mb-1" for="data">Data</label>
          <input class="form-control form-control-sm" type="date" id="data" name="data"
                 value="{{ linha.data.isoformat() }}" required>
        </div>
        <div class="col-6 col-md-3">
          <label class="form-label small mb-1" for="tipo">Tipo</label>
          <select class="form-select form-select-sm" id="tipo" name="tipo" required>
            {% for v, r in tipos %}<option value="{{ v }}" {{ 'selected' if v == linha.tipo }}>{{ r }}</option>{% endfor %}
          </select>
        </div>
        <div class="col-12 col-md-4">
          <label class="form-label small mb-1" for="categoria">Categoria</label>
          <select class="form-select form-select-sm" id="categoria" name="categoria" required>
            {% for v, r in categorias %}<option value="{{ v }}" {{ 'selected' if v == linha.categoria }}>{{ r }}</option>{% endfor %}
          </select>
        </div>
        <div class="col-6 col-md-2">
          <label class="form-label small mb-1" for="valor">Valor</label>
          <input class="form-control form-control-sm" id="valor" name="valor"
                 value="{{ ('%.2f'|format(linha.valor or 0)).replace('.', ',') }}" required>
        </div>
        <div class="col-12 col-md-7">
          <label class="form-label small mb-1" for="descricao">Do que se trata</label>
          <input class="form-control form-control-sm" id="descricao" name="descricao"
                 value="{{ linha.descricao }}" required maxlength="300">
        </div>
        <div class="col-12 col-md-5">
          <label class="form-label small mb-1" for="contraparte">De quem / para quem</label>
          <input class="form-control form-control-sm" id="contraparte" name="contraparte"
                 value="{{ linha.contraparte or '' }}" maxlength="160">
        </div>
        <div class="col-6 col-md-3">
          <label class="form-label small mb-1" for="documento_tipo">Documento</label>
          <select class="form-select form-select-sm" id="documento_tipo" name="documento_tipo">
            {% for v, r in documentos %}<option value="{{ v }}" {{ 'selected' if v == (linha.documento_tipo or 'sem') }}>{{ r }}</option>{% endfor %}
          </select>
        </div>
        <div class="col-6 col-md-3">
          <label class="form-label small mb-1" for="documento_numero">Número</label>
          <input class="form-control form-control-sm" id="documento_numero" name="documento_numero"
                 value="{{ linha.documento_numero or '' }}" maxlength="60">
        </div>
        <div class="col-12 col-md-6">
          <label class="form-label small mb-1" for="rubrica">Rubrica do orçamento <span class="text-muted">(opcional)</span></label>
          <input class="form-control form-control-sm" id="rubrica" name="rubrica"
                 value="{{ linha.rubrica or '' }}" maxlength="120">
        </div>
        <div class="col-12">
          <label class="form-label small mb-1" for="observacao">Observação <span class="text-muted">(opcional)</span></label>
          <input class="form-control form-control-sm" id="observacao" name="observacao"
                 value="{{ linha.observacao or '' }}" maxlength="2000">
        </div>
        <div class="col-12">
          <label class="form-label small mb-1" for="anexo">
            Comprovante
            {% if linha.anexo_path %}<span class="text-muted">— atual: {{ linha.anexo_nome }}. Escolha outro arquivo só se quiser trocar.</span>
            {% else %}<span class="text-muted">— nenhum anexado.</span>{% endif %}
          </label>
          <input class="form-control form-control-sm" type="file" id="anexo" name="anexo"
                 accept=".jpg,.jpeg,.png,.webp,.heic,.pdf">
        </div>
        <div class="col-12 d-flex gap-2">
          <button class="btn btn-sm btn-success"><i class="fas fa-check"></i> Salvar correção</button>
          <a class="btn btn-sm btn-outline-secondary" href="{{ url_for('caixa.index', ano=ano, mes=mes) }}">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
