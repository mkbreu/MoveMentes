<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block titulo %}Conferência de Km{% endblock %} - MoveMentes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    body { background: #f5f7fa; font-size: 1.15rem; }
    .hero-conf { background: linear-gradient(135deg, #C9FF6E 0%, #a8e063 100%); padding: 1.6rem 0 1.2rem; }
    .hero-conf h1 { font-weight: 700; font-size: 1.6rem; margin: 0; }
    .card-grande { border: none; box-shadow: 0 2px 10px rgba(0,0,0,.09); border-radius: 14px; }
    .form-select-lg, .btn-conferir { font-size: 1.3rem; padding: .8rem 1rem; }
    .btn-conferir { font-weight: 700; border-radius: 12px; }
    .passo { display:flex; align-items:center; gap:.6rem; font-weight:700; margin-bottom:.4rem; }
    .passo .num { background:#2d6a4f; color:#fff; border-radius:50%; width:2rem; height:2rem;
                  display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .foto-atleta { width:64px; height:64px; border-radius:50%; object-fit:cover; }
    footer.pub { text-align:center; padding:1.2rem; color:#888; font-size:.9rem; }
  </style>
</head>
<body>
<div class="hero-conf">
  <div class="container">
    <h1><i class="fas fa-clipboard-check me-2"></i>{% block cabecalho %}Conferência de Km{% endblock %}</h1>
  </div>
</div>
<div class="container py-4" style="max-width: 760px;">
  {% block conteudo %}{% endblock %}
</div>
<footer class="pub">MoveMentes — dados das atividades públicas do Strava</footer>
</body>
</html>
